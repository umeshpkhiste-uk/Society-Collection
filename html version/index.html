<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe · Society Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="board">
    <div class="wing-tag">WING · E</div>
    <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="wordmark">{U}niverse</div>
    <div class="tagline">THE ALL IN LIFE</div>
    <div class="fund-label">Annual Fund Collection</div>
  </header>

  <main>
    <div class="status-banner" id="statusBanner"></div>

    <!-- HOME SCREEN -->
    <section class="screen active" id="screen-home">
      <div class="summary-row">
        <div class="summary paid"><div class="num" id="sumPaid">0</div><div class="lbl">Collected</div></div>
        <div class="summary pending"><div class="num" id="sumPending">0</div><div class="lbl">Pending</div></div>
        <div class="summary"><div class="num" id="sumTotal">0</div><div class="lbl">Total Flats</div></div>
      </div>
      <div class="search-wrap">
        <input type="search" id="homeSearch" placeholder="Search flat number or owner name">
      </div>
      <div id="flatGroups"></div>
    </section>

    <!-- RECEIPT SCREEN -->
    <section class="screen" id="screen-receipt">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">&#8592;</button>
        <div class="screen-title">New Receipt</div>
      </div>
      <div class="card flat-header">
        <div class="num" id="rFlatNum"></div>
        <div class="name" id="rFlatName"></div>
        <div class="wing" id="rFlatWing"></div>
      </div>

      <label class="field">Amount (Rs.)</label>
      <input type="text" id="fAmount" inputmode="decimal" placeholder="e.g. 15000">

      <label class="field">On account of</label>
      <input type="text" id="fAccountOf" value="Annual Maintenance Fund">

      <label class="field">Payment via</label>
      <select id="fMode" onchange="onModeChange()">
        <option>Cash</option>
        <option>Cheque</option>
        <option>NEFT</option>
        <option>Mygate</option>
      </select>

      <div id="extraFields" style="display:none;">
        <label class="field" id="refLabel">Cheque No.</label>
        <input type="text" id="fRef">
        <label class="field">Drawn on Bank</label>
        <input type="text" id="fBank">
        <label class="field">Branch</label>
        <input type="text" id="fBranch">
      </div>

      <label class="field">Date</label>
      <input type="text" id="fDate">

      <button class="submit-btn" id="submitBtn" onclick="submitReceipt()">Save Receipt</button>
    </section>

    <!-- REPORTS SCREEN -->
    <section class="screen" id="screen-reports">
      <div class="screen-title" style="margin-bottom:14px;">Reports</div>
      <input type="search" id="reportSearch" placeholder="Search flat / name / receipt no.">
      <label class="field">Filter by date</label>
      <input type="text" id="reportDate" placeholder="dd/MM/yyyy or partial e.g. 09/2026">
      <div class="report-summary">
        <span id="reportCount">0 receipts</span>
        <span class="total" id="reportTotal">Rs. 0.00</span>
      </div>
      <div id="reportList"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="active" data-tab="home" onclick="switchTab('home')"><span class="icon">&#8862;</span>Flats</button>
    <button data-tab="reports" onclick="switchTab('reports')"><span class="icon">&#9776;</span>Reports</button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="receipt-paper" id="receiptPaper"></div>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
