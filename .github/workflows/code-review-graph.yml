name: Code Review Graph

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tirth8205/code-review-graph@v2.3.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Sticky PR comment disabled: v2.3.9's author-detection step calls
          # `gh api user`, which 403s with the default GITHUB_TOKEN and crashes
          # the job (see PR discussion). Re-enable once upstream fixes it, or
          # switch github-token to a personal-access-token secret.
          comment: false
